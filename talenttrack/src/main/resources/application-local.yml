spring:
  datasource:
    url: jdbc:mysql://localhost:3306/talenttrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id.apps.googleusercontent.com
            client-secret: dummy-google-client-secret

app:
  jwt:
    secret: "super-secret-key-that-is-at-least-256-bits-long-and-should-be-kept-safe-1234567890"
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  google:
    client-id: dummy-google-client-id.apps.googleusercontent.com

resilience4j.circuitbreaker:
  instances:
    notificationService:
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3
